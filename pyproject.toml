[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Personal Garmin data pipeline and MCP server"
authors = [
    { name = "Ben Sauber", email = "bensauber904@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "garminconnect>=0.3.17",
    "mcp>=2.3.0",
    "sqlglot>=30.22.0",
]

[project.scripts]
garmin-fetch = "garmin_mcp.fetch_activities:main"
garmin-fetch-daily = "garmin_mcp.fetch_daily:main"
garmin-fetch-runs = "garmin_mcp.fetch_runs:main"
garmin-mcp = "garmin_mcp.server:main"
garmin-demo = "garmin_mcp.demo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
eval = [
    "anthropic>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import evals/
